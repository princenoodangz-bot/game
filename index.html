    <!-- Top Navigation Header -->
    <header class="relative px-5 pt-3 pb-2 z-40 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-11 h-11 bg-white rounded-2xl shadow-bouncy flex items-center justify-center border-2 border-yellow-300 relative group">
          <span class="text-2xl badge-glow">🎓</span>

          <h1 class="text-xl font-black tracking-wide text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.25)] flex items-center gap-1">

    <main class="flex-1 px-4 pt-2 space-y-4 z-30">

      <!-- ================= LOGIN VIEW ================= -->
      <div id="view-login" class="space-y-4 block">
        <section class="text-center py-2 relative">
          <div class="inline-block bg-white/20 backdrop-blur-md text-white text-xs font-semibold px-4 py-1 rounded-full mb-1 border border-white/30 shadow-sm">

          </div>
          <h2 class="text-2xl font-extrabold text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)] tracking-tight">ล็อกอินด้วยรหัสประจำตัว</h2>
          <p class="text-xs text-blue-100 font-medium">เข้าสู่ดินแดนบทเรียน มินิเกม และสะสมแต้มคะแนน</p>
        </section>

        <section class="bg-white rounded-3xl p-5 shadow-bouncy-card border-2 border-blue-100 relative overflow-hidden">
          <div class="absolute -top-10 -right-10 w-28 h-28 bg-yellow-100/70 rounded-full pointer-events-none"></div>
          <div class="absolute -bottom-8 -left-8 w-24 h-24 bg-sky-100/60 rounded-full pointer-events-none"></div>
          
          <div class="flex items-center justify-between mb-4 relative z-10">
            <div class="flex items-center space-x-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-400 to-blue-600 p-0.5 shadow-md flex items-center justify-center">
                <div class="w-full h-full bg-white rounded-2xl flex items-center justify-center text-2xl">🎒</div>
              </div>
              <div>
                <span class="inline-block text-[10px] font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full border border-sky-200">ระบบนักเรียนออนไลน์</span>
                <h3 class="text-base font-extrabold text-slate-800">เข้าสู่ระบบนักเรียน</h3>
              </div>
            </div>
          </div>

          <form id="student-login-form" onsubmit="handleLogin(event)" class="space-y-3 relative z-10">
            <div class="space-y-1.5">
              <label class="text-xs font-semibold text-slate-600 flex items-center justify-between" for="student-id-input">
                <span>เลขประจำตัวนักเรียน</span>
                <span class="text-[11px] text-amber-600 font-normal">เช่น 54321</span>
              </label>
              <div class="relative flex items-center">
                <div class="absolute left-3.5 text-sky-500 flex items-center pointer-events-none">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
                <!-- เปลี่ยนเป็น inputmode="numeric" ให้พิมพ์ง่ายขึ้นบนมือถือ -->
                <input id="student-id-input" class="w-full bg-slate-50 border-2 border-slate-200 text-slate-800 text-sm font-bold rounded-2xl py-3 pl-11 pr-24 focus:ring-4 focus:ring-sky-100 focus:border-sky-500 focus:bg-white transition-all tracking-wider placeholder:text-slate-400 placeholder:font-normal placeholder:tracking-normal placeholder:text-xs" inputmode="numeric" placeholder="กรอกเลขรหัสนักเรียน" type="text" required/>
              </div>
            </div>
            
            <p id="login-error" class="text-rose-500 text-xs font-bold text-center hidden">ไม่พบรหัสนักเรียนนี้ในระบบ</p>

            <button id="btn-submit-login" type="submit" class="w-full bg-gradient-to-r from-emerald-400 via-teal-500 to-green-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-base py-3.5 px-4 rounded-2xl shadow-bouncy-green transition-all transform active:translate-y-1 active:shadow-none flex items-center justify-center space-x-2 border-t border-emerald-300">
              <span>🎮</span>
              <span>เข้าสู่เกม / เริ่มต้นผจญภัย</span>
            </button>
          </form>
        </section>
      </div>

    </main>

    <!-- Bottom Fixed Navigation Bar (แบบหน้าล็อกอิน) -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white/95 backdrop-blur-lg border-t border-slate-200 px-3 pt-2 pb-5 z-50 rounded-t-3xl shadow-[0_-8px_20px_rgba(0,0,0,0.06)]">
      <div class="flex items-center justify-around">
        <!-- เราทำเป็นปุ่มสีเทาๆ ไว้ก่อน เพื่อความสวยงาม -->
        <div class="flex flex-col items-center text-blue-600"><div class="w-10 h-8 rounded-full bg-blue-100 flex items-center justify-center"><svg class="w-5 h-5 text-blue-600" fill="currentColor" viewbox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg></div><span class="text-[10px] font-extrabold mt-0.5">เข้าสู่ระบบ</span><span class="w-1.5 h-1.5 bg-blue-600 rounded-full mt-0.5"></span></div>
        <div class="flex flex-col items-center text-slate-300"><div class="w-10 h-8 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><span class="text-[10px] font-medium mt-0.5">รอโหลด</span></div>
        <div class="flex flex-col items-center -mt-6 opacity-50"><div class="w-13 h-13 bg-slate-300 rounded-full p-1 border-4 border-white flex items-center justify-center"><span class="text-2xl">🔒</span></div><span class="text-[10px] font-bold text-slate-400 mt-1">ล็อคอยู่</span></div>
        <div class="flex flex-col items-center text-slate-300"><div class="w-10 h-8 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><span class="text-[10px] font-medium mt-0.5">รอโหลด</span></div>
        <div class="flex flex-col items-center text-slate-300"><div class="w-10 h-8 rounded-full flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path></svg></div><span class="text-[10px] font-medium mt-0.5">รอโหลด</span></div>
      </div>
      <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-2.5"></div>
    </nav>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script>
    // ⚠️ อย่าลืมนำ URL และ Key ของคุณมาใส่ตรงนี้นะครับ
    const SUPABASE_URL = 'https://gtcjixepijvcgvyfpqws.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0Y2ppeGVwaWp2Y2d2eWZwcXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3MjU5NDYsImV4cCI6MjEwMTMwMTk0Nn0.FyEIl4r_LXhLeUxIzHusKzpnp7EdMvjADCdiLEMS-G8';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // เช็คก่อนว่าล็อกอินค้างไว้หรือเปล่า (UX ที่ดี)
    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('schoolquest_student')) {
            // ถ้าเคยล็อกอินไว้แล้ว ให้เตะไปหน้า Dashboard เลย
            window.location.href = 'dashboard.html';
        }
    });

    // ระบบล็อกอินหลัก (จากบรรทัด 182 ใน index_3.html)
    async function handleLogin(e) {
        e.preventDefault();
        
        const input = document.getElementById('student-id-input').value.trim();
        const btn = document.getElementById('btn-submit-login');
        const errorMsg = document.getElementById('login-error');

        if (!input) return;

        btn.innerHTML = '<span>⏳</span><span>กำลังค้นหาข้อมูลนักเรียน...</span>';
        errorMsg.classList.add('hidden');

        try {
            // ✅ เติมคำว่า Client ต่อท้ายให้ตรงกับตัวแปรที่เราสร้างไว้
            const { data, error } = await supabaseClient
                .from('students')
                .select('*')
                .eq('student_code', input)
                .single();

            if (error || !data) throw error; 

            // บันทึกข้อมูลนักเรียนลง LocalStorage
            localStorage.setItem('schoolquest_student', JSON.stringify(data));
            
            // ✅ แก้ตรงนี้: เปลี่ยนเป็นชื่อไฟล์ dashboard_2.html ที่คุณใช้อยู่จริง
            window.location.href = 'dashboard_2.html';

        } catch (err) {
            console.error("Login Failed:", err);
            errorMsg.classList.remove('hidden');
            btn.innerHTML = '<span>🎮</span><span>เข้าสู่เกม / เริ่มต้นผจญภัย</span>';
        }
    }
</script>

</body>
