<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ตั้งค่า PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Error', err));
            });
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- ส่วนที่ 1: หน้าจอ Login -->
    <div id="login-section" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold text-blue-600 mb-6">เข้าสู่ระบบ</h1>
            <p class="text-gray-500 mb-4 text-sm">กรุณากรอกรหัสประจำตัวนักเรียนเพื่อเข้าเล่นเกม</p>
            
            <input type="text" id="student_code_input" placeholder="รหัสประจำตัวนักเรียน" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 text-center text-lg">
            
            <button onclick="handleLogin()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                เข้าสู่ระบบ
            </button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden">ไม่พบรหัสนักเรียนนี้ในระบบ</p>
        </div>
    </div>

    <!-- ส่วนที่ 2: หน้า Dashboard (ซ่อนไว้ก่อนจนกว่าจะล็อกอิน) -->
    <div id="dashboard-section" class="hidden min-h-screen flex-col">
        <!-- แถบเมนูด้านบน -->
        <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">🎮 ศูนย์รวมมินิเกม</h1>
            <div class="flex items-center gap-4">
                <span id="student-name-display" class="text-sm font-medium"></span>
                <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm shadow">
                    ออกระบบ
                </button>
            </div>
        </header>

        <!-- พื้นที่แสดงรายชื่อเกม (จะดึงข้อมูลมาใส่ในเฟส 3) -->
        <main class="flex-grow p-4 md:p-6">
            <h2 class="text-lg font-bold text-gray-700 mb-4">เลือกเกมที่ต้องการเล่นเลย!</h2>
            <div id="games-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- การ์ดเกมจะถูกสร้างอัตโนมัติด้วย JavaScript ตรงนี้ -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
